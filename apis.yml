name: My China Roots
description: My China Roots is a Chinese heritage genealogy platform that helps people of Chinese
  descent trace their ancestry, find records of their ancestors, connect with long-lost relatives,
  and organize roots trips to China. The platform offers a searchable database of roughly 200 million
  ancestors drawn from digitized clan books (zupu), overseas immigration records, tombstones, obituaries,
  and clan association member lists, alongside family-tree building and a Library Edition for institutions.
  It was surfaced as a 500 Global portfolio company. This profile was enriched by the API Evangelist
  pipeline; the company exposes a consumer web application only, with no discoverable public API,
  developer portal, SDKs, or machine-readable API surface at this time.
